# Keep the Mesa link CONFIGURED when the Mesa is powered off.
#
# eno1 carries a static 10.10.10.11/8 to the Mesa card. NetworkManager's default
# is to deconfigure a wired device that loses carrier, so powering the Mesa down
# tore the address off an interface whose address never depended on the far end
# in the first place.
#
# Matched on interface name rather than the connection, because this governs the
# DEVICE, not the profile.
[device-mesa]
match-device=interface-name:eno1
ignore-carrier=yes
