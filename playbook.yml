- name: linuxcnc basic
  hosts: local
  become: yes

  vars:
    # The human account this workstation is configured FOR: the account whose
    # desktop session LinuxCNC runs in, and whose ~/.profile its HAL components
    # inherit their environment from. NAMED on purpose, added 2026-09-01. It
    # used to be inferred from ansible_env.USER, which follows the BECOME
    # identity rather than the invoker and therefore rendered "root" under this
    # play's play-level become: yes. Override with -e dcnc_user=<name>.
    dcnc_user: evand

    # DISPLAY BLANKING, added 2026-09-07 with the Elo 2494L. Two timeouts, not
    # one, and the order between them is load-bearing: the screensaver overlay
    # has to be up and holding an input grab BEFORE the panel goes dark, or the
    # touch that wakes the screen lands in AXIS instead (see the display policy
    # block below). Keep idle < blank.
    #
    # 10 minutes is chosen against how cncpc is actually used, not as a round
    # number: long enough that reading a tool table or squinting at a backplot
    # never blanks on you, short enough that the overnight and between-jobs
    # idling -- which is most of this machine's powered hours -- stops burning
    # backlight. It costs nothing during a job, because the guard suspends both
    # timeouts while the interpreter is running.
    cncpc_display_idle_secs: 600
    cncpc_display_blank_secs: 660

    # How often the guard asks LinuxCNC whether it is busy. This is also the
    # worst-case window in which a display that blanked just as a program
    # started gets forced back on, so it wants to stay small; it is two
    # subprocess-free status polls and at most two xset calls per tick.
    cncpc_display_poll_secs: 10

    # WHERE THE RESTIC BACKUP LIVES. Defaults ARE the production values, so an
    # un-overridden run behaves exactly as before -- the template renders
    # byte-identical to the script these replaced, and that is asserted rather
    # than assumed (see templates/cncpc-restic-backup.sh.j2).
    #
    # Added 2026-09-03 so the DRY RUN can prove the playbook without the real
    # repo password. Assertion 13 of the dry run was previously unreachable:
    # REPO and the NFS source were hardcoded, so the only way to satisfy it was
    # to put the real backup credential on a disposable VM and point it at the
    # production repo -- which tests the SECRET, not the automation. The
    # playbook cannot be wrong about a value typed into it. Pointed at a
    # scratch repo, the same assertion tests the restic wiring end to end,
    # which is what the drill exists to prove.
    #
    # Dry-run invocation, all four together:
    #   -e cncpc_backups_mount_nfs=false \
    #   -e cncpc_backups_mount=/var/tmp/dryrun-backups \
    #   -e cncpc_restic_repo=/var/tmp/dryrun-backups/cncpc-restic \
    #   -e '{"cncpc_backups_guard":"test -d /var/tmp/dryrun-backups"}' \
    #   -e '{"cncpc_backups_guard_msg":"/var/tmp/dryrun-backups missing"}'
    #
    # THE JSON FORM IS LOAD-BEARING for those last two. ansible parses
    # `-e key=value` with parse_kv, which splits on WHITESPACE -- so
    # `-e "cncpc_backups_guard=test -d /path"` sets the variable to the
    # single word `test` and scatters the rest. The script then renders
    # `if ! test; then`, bare `test` returns false, the guard fires and
    # the backup aborts. Measured 2026-09-03, on the first run of this
    # very invocation. Same trap the README documents for the pause
    # prompts, one layer down.
    cncpc_backups_mount: /mnt/backups
    cncpc_backups_nfs_src: "192.168.1.143:/volume1/backups"
    cncpc_backups_mount_nfs: true
    cncpc_restic_repo: "{{ cncpc_backups_mount }}/cncpc-restic"
    # The guard is a COMMAND, not a flag, so a scratch target swaps
    # `mountpoint -q` for `test -d` without conditional logic in the script.
    cncpc_backups_guard: "mountpoint -q {{ cncpc_backups_mount }}"
    cncpc_backups_guard_msg: "{{ cncpc_backups_mount }} not mounted"

  tasks:

    - name: check if x11vnc password file exists
      ansible.builtin.stat:
        path: /etc/x11vnc.pass
      register: x11vnc_pass_file

    - name: prompt for VNC password if needed
      ansible.builtin.pause:
        prompt: "Enter the VNC password"
        echo: no
      register: vnc_password_input
      no_log: true
      when: not x11vnc_pass_file.stat.exists

    - name: confirm VNC password if needed
      ansible.builtin.pause:
        prompt: "Confirm the VNC password"
        echo: no
      register: vnc_password_confirm
      no_log: true
      when: not x11vnc_pass_file.stat.exists

    - name: verify VNC passwords match
      ansible.builtin.fail:
        msg: "VNC passwords do not match!"
      when: 
        - not x11vnc_pass_file.stat.exists
        - vnc_password_input.user_input != vnc_password_confirm.user_input

    - name: set VNC password variable
      ansible.builtin.set_fact:
        vnc_password: "{{ vnc_password_input.user_input }}"
      when: not x11vnc_pass_file.stat.exists

    # DISCOVER-then-hold, replacing a literal bookworm package name
    # (linux-image-6.1.0-30-rt-amd64) on 2026-08-29. That literal does not exist
    # on trixie and dpkg_selections FAILS rather than skipping, so a rebuild
    # stopped dead here at task 7 of 34 -- proven in a disposable trixie VM, not
    # reasoned about. Naming trixie's current RT kernel as a literal instead
    # would only defer the same failure: trixie ships point releases and
    # superseded RT binaries leave the archive.
    - name: discover the installed RT kernel image
      ansible.builtin.shell:
        cmd: "dpkg-query -W -f='${Package}\\n' 'linux-image-[0-9]*-rt-amd64' 2>/dev/null | head -1"
      register: rt_kernel_pkg
      changed_when: false
      failed_when: false

    - name: hold the installed RT kernel image
      ansible.builtin.dpkg_selections:
        name: "{{ rt_kernel_pkg.stdout | trim }}"
        selection: hold
      when: rt_kernel_pkg.stdout | trim | length > 0

    - name: report when no RT kernel is installed yet
      ansible.builtin.debug:
        msg: >-
          No linux-image-*-rt-amd64 package is installed, so nothing was held.
          On a fresh LinuxCNC ISO the RT kernel arrives with the distribution;
          if this message appears on a real rebuild, the kernel step above it
          did not do what it claims.
      when: rt_kernel_pkg.stdout | trim | length == 0

    # Guarded 2026-08-29. The metapackage was believed "safe named literally";
    # execution showed dpkg_selections fails hard when the package is not
    # INSTALLED, which is the same failure as the bookworm literal above.
    - name: is the RT metapackage installed
      ansible.builtin.shell:
        cmd: "dpkg-query -W -f='${Status}' linux-image-rt-amd64 2>/dev/null | grep -q 'install ok installed'"
      register: rt_meta
      changed_when: false
      failed_when: false

    - name: hold the RT metapackage
      ansible.builtin.dpkg_selections:
        name: linux-image-rt-amd64
        selection: hold
      when: rt_meta.rc == 0

    - name: disable brltty service
      ansible.builtin.systemd:
        name: brltty
        enabled: no
        state: stopped
        masked: yes
      ignore_errors: yes

    - name: disable brltty-udev service
      ansible.builtin.systemd:
        name: brltty-udev
        enabled: no
        state: stopped
        masked: yes
      ignore_errors: yes

    - name: disable initramfs automatic updates
      ansible.builtin.lineinfile:
        path: /etc/initramfs-tools/update-initramfs.conf
        regexp: "^update_initramfs="
        line: "update_initramfs=no"
        backup: yes

    - name: update package lists and upgrade system
      ansible.builtin.shell:
        cmd: "apt update && apt upgrade -y"
      register: apt_upgrade_result
      changed_when: "'upgraded' in apt_upgrade_result.stdout"

    - name: check if any interface has IP 10.10.10.11
      ansible.builtin.shell:
        cmd: "ip addr show | grep -q '10.10.10.11/'"
      register: mesa_ip_check
      failed_when: false
      changed_when: false

    - name: get available ethernet interfaces
      ansible.builtin.shell:
        cmd: "ip link show | awk '$2 ~ /^(eth|enp|ens)/ {gsub(/:/, \"\", $2); print $2}'"
      register: ethernet_interfaces
      when: mesa_ip_check.rc != 0
      changed_when: false

    - name: prompt for ethernet interface selection
      ansible.builtin.pause:
        prompt: |
          Available ethernet interfaces:
          {{ ethernet_interfaces.stdout_lines | join("\n") }}
          
          Select the interface to configure for Mesa (10.10.10.11):
      register: selected_interface
      when: mesa_ip_check.rc != 0 and ethernet_interfaces.stdout_lines | length > 0

    - name: configure selected interface with Mesa IP
      ansible.builtin.shell:
        cmd: "nmcli connection add type ethernet con-name mesa ifname {{ selected_interface.user_input }} ipv4.addresses 10.10.10.11/8 ipv4.method manual autoconnect yes"
      when: mesa_ip_check.rc != 0 and selected_interface.user_input is defined
      register: mesa_interface_result
      changed_when: true


    # --- Mesa link survivability, added 2026-08-30 -------------------------
    # Three changes that together let the Mesa link survive the Mesa being
    # powered off, and let a PC booted before the Mesa still bring the link up
    # when the Mesa arrives. Before them, either case left eno1 with NO NETDEV
    # AT ALL -- e1000e probe failed with -3 -- and the only recovery was a
    # reboot with the Mesa already on.
    #
    # Verified at the machine both ways on 2026-08-30. Attribution between them
    # is NOT established: four things changed at once, including a BIOS setting
    # ansible cannot reach (Integrated NIC "Enabled with PXE" -> "Enabled").
    # EEE-off provably cannot explain the boot-time half, since its dispatcher
    # only fires on 'up'. If this regresses, check wake-on-lan first.

    - name: install ethtool for Mesa link power management
      ansible.builtin.apt:
        name: ethtool
        state: present

    - name: keep the Mesa link configured when the Mesa is powered off
      ansible.builtin.copy:
        src: NetworkManager/conf.d/10-mesa-ignore-carrier.conf
        dest: /etc/NetworkManager/conf.d/10-mesa-ignore-carrier.conf
        owner: root
        group: root
        mode: "0644"
      notify: reload networkmanager

    - name: disable EEE on the Mesa link on every up event
      ansible.builtin.copy:
        src: NetworkManager/dispatcher.d/50-mesa-eee-off
        dest: /etc/NetworkManager/dispatcher.d/50-mesa-eee-off
        owner: root
        group: root
        mode: "0755"

    # Read before writing so this is idempotent and reports honestly. A bare
    # `nmcli connection modify` always exits 0 and would report changed every run.
    - name: read the mesa connection's current wake-on-lan setting
      ansible.builtin.command:
        cmd: nmcli -g 802-3-ethernet.wake-on-lan connection show mesa
      register: mesa_wol
      changed_when: false
      failed_when: false

    - name: keep the Mesa PHY powered by enabling wake-on-lan
      ansible.builtin.command:
        cmd: nmcli connection modify mesa 802-3-ethernet.wake-on-lan magic
      when:
        - mesa_wol.rc == 0
        - (mesa_wol.stdout | trim) != "magic"
      notify: reload networkmanager

    - name: report when the mesa connection does not exist yet
      ansible.builtin.debug:
        msg: >-
          The 'mesa' NetworkManager connection does not exist, so wake-on-lan was
          not set on it. That is expected on a first run before the Mesa
          interface is configured above, and a problem on any later run.
      when: mesa_wol.rc != 0

    - name: install required packages
      ansible.builtin.apt:
        name:
          - git
          - cinnamon
          - x11vnc
          # for /usr/local/bin/cncpc-display-guard: xset lives in
          # x11-xserver-utils, and the org.freedesktop.ScreenSaver inhibit
          # needs a persistent session-bus connection, which means the dbus
          # python bindings rather than a one-shot `gdbus call` (a cookie dies
          # with the connection that took it, so the CLI cannot hold one).
          - x11-xserver-utils
          - python3-dbus
        state: present
        update_cache: yes


    - name: set cinnamon as default session manager
      ansible.builtin.lineinfile:
        path: /etc/lightdm/lightdm.conf
        regexp: '^#?user-session='
        line: 'user-session=cinnamon'
        backup: yes
      notify: restart lightdm

    # ==========================================================================
    # DISPLAY POLICY -- rewritten 2026-09-07, when the panel became an Elo
    # 2494L. What was here before was three settings that between them meant
    # "never blank": lock off, idle activation OFF, and display sleep at 3600s.
    # On a machine that idles at a static LinuxCNC GUI far more than it cuts,
    # that is an hour of unchanging DRO digits in fixed pixels, forever.
    #
    # The 2494L is an LED-backlit industrial LCD, so the risk is NOT OLED
    # burn-in. It is backlight hours -- a panel that never sleeps burns 8760 a
    # year against a rating in the tens of thousands -- and image sticking,
    # which is what an LCD holding one frame for months gets instead.
    #
    # THE PART THAT IS NOT ABOUT THE MONITOR. The 2494L is a TOUCHSCREEN, and
    # this is why "just shorten the timeout" was the wrong patch. DPMS powers
    # the panel down but leaves X fully live, so a touch on a dark screen is
    # delivered straight to whatever sits under the finger -- the operator's
    # wake-up tap becomes a blind click in AXIS, at a coordinate they did not
    # choose, on a machine tool. So idle-activation-enabled is turned back ON:
    # cinnamon-screensaver takes an input grab, and the waking touch is spent
    # dismissing the overlay instead of pressing a button. The panel still
    # powers down behind it, so nothing is given up on the backlight.
    #
    # lock-enabled STAYS false. The overlay is there to eat one touch, not to
    # put a password prompt between an operator and a running machine.
    #
    # The two timeouts are staggered on purpose: the overlay at
    # cncpc_display_idle_secs, the panel off a minute later at
    # cncpc_display_blank_secs, so the grab is already in place before the
    # screen goes dark. Neither fires while a program is running --
    # /usr/local/bin/cncpc-display-guard below holds both off for that.
    #
    # These run as the INVOKING user, not root: gsettings writes through the
    # caller's session D-Bus to the caller's dconf, so a value set as root
    # lands in root's dconf and the operator's session never sees it. That is
    # what `become: no` is for here. The inert
    # `become_user: ansible_env.USER` expression these tasks used to carry is
    # dropped -- with become off it did nothing, and it named the very
    # expression the Adafruit block below documents as rendering "root".
    # It also means these three want a run from a terminal INSIDE the Cinnamon
    # session, which is how this playbook is invoked anyway (hosts: local).
    # ==========================================================================
    - name: do not lock the screen (the operator must never meet a password prompt)
      ansible.builtin.command:
        cmd: gsettings set org.cinnamon.desktop.screensaver lock-enabled false
      become: no
      changed_when: false

    - name: enable the screensaver overlay, so a waking touch is not a click in AXIS
      ansible.builtin.command:
        cmd: gsettings set org.cinnamon.desktop.screensaver idle-activation-enabled true
      become: no
      changed_when: false

    - name: show the screensaver overlay after {{ cncpc_display_idle_secs }}s idle
      ansible.builtin.command:
        cmd: >-
          gsettings set org.cinnamon.desktop.session idle-delay
          'uint32 {{ cncpc_display_idle_secs }}'
      become: no
      changed_when: false

    - name: power the panel down after {{ cncpc_display_blank_secs }}s idle
      ansible.builtin.command:
        cmd: >-
          gsettings set org.cinnamon.settings-daemon.plugins.power sleep-display-ac
          {{ cncpc_display_blank_secs }}
      become: no
      changed_when: false

    - name: install the display guard
      ansible.builtin.copy:
        src: files/cncpc-display-guard
        dest: /usr/local/bin/cncpc-display-guard
        owner: root
        group: root
        mode: '0755'
      notify: restart display guard

    - name: install the display guard user unit
      ansible.builtin.template:
        src: templates/cncpc-display-guard.service.j2
        dest: /etc/systemd/user/cncpc-display-guard.service
        owner: root
        group: root
        mode: '0644'
      notify:
        - reload systemd
        - restart display guard

    # --global, not --user. Enabling a user unit the ordinary way needs a live
    # user bus for {{ dcnc_user }}, which a provisioning run cannot count on
    # having (and definitely does not have on a first boot before anyone has
    # logged in). --global writes the wants symlink under /etc/systemd/user/
    # instead, so the unit is enabled for the next session whether or not one
    # exists right now.
    - name: enable the display guard for every graphical session
      ansible.builtin.command:
        cmd: systemctl --global enable cncpc-display-guard.service
      register: display_guard_enable
      changed_when: "'Created symlink' in display_guard_enable.stderr"

    # Best-effort, and non-fatal on purpose. If the playbook is being run from
    # a desktop terminal there IS a session to start this in and the guard
    # should begin working now rather than at next login. If there is not --
    # a headless first provision, a run over SSH -- the --global enable above
    # has already done the durable half and this is noise, not a failure.
    - name: start the display guard in the current session if there is one
      ansible.builtin.command:
        cmd: systemctl --user start cncpc-display-guard.service
      become: no
      register: display_guard_start
      changed_when: display_guard_start.rc == 0
      failed_when: false

    - name: create x11vnc password file
      ansible.builtin.shell:
        cmd: 'printf "{{ vnc_password }}\n{{ vnc_password }}\n" | x11vnc -storepasswd /etc/x11vnc.pass'
      args:
        creates: "/etc/x11vnc.pass"
      changed_when: false
      when: not x11vnc_pass_file.stat.exists

    - name: create x11vnc systemd service
      ansible.builtin.copy:
        src: files/x11vnc.service
        dest: /etc/systemd/system/x11vnc.service
        owner: root
        group: root
        mode: '0644'
      notify:
        - reload systemd
        - restart x11vnc

    - name: enable and start x11vnc service
      ansible.builtin.systemd:
        name: x11vnc
        enabled: yes
        state: started
        daemon_reload: yes

    # Timeshift (3 tasks) and BackInTime (2 tasks) were REMOVED 2026-08-30,
    # along with files/timeshift.json and the two packages above. They are
    # superseded by the restic role below, which is the proven mechanism
    # (restore verified 2026-08-01, snapshot 31cfa91e, byte-for-byte) and which
    # backs up to an NFS repo rather than to a partition on the very disk a
    # rebuild replaces. This also retires the hard-coded /dev/sda5 -- it was
    # only ever Timeshift's snapshot device, so it died with it rather than
    # needing its own fix.

    - name: copy udev rules for imach-p4s
      ansible.builtin.copy:
        src: files/99-imach-p4s.rules
        dest: /etc/udev/rules.d/99-imach-p4s.rules
        owner: root
        group: root
        mode: '0644'
        backup: yes
      notify: reload udev rules

    - name: clone Funkenjaeger/fj-lcnc-cfg repo
      ansible.builtin.git:
        repo: https://github.com/Funkenjaeger/fj-lcnc-cfg.git
        dest: "~/linuxcnc"
      become: no
      become_user: "{{ ansible_env.USER | default(ansible_user_id) }}"

    - name: check if virtual environment exists
      ansible.builtin.stat:
        path: /usr/local/venv/linuxcnc_venv/bin/activate
      register: venv_exists

    - name: create directory for virtual environment
      ansible.builtin.file:
        path: /usr/local/venv
        state: directory
        owner: "{{ ansible_env.USER | default(ansible_user_id) }}"
        mode: '0755'
      when: not venv_exists.stat.exists

    # ==========================================================================
    # ADAFRUIT IO CREDENTIALS -- rewritten 2026-09-01. Three defects, each
    # measured on the dcnc-dryrun VM or read on the real cncpc, not reasoned
    # about.
    #
    # 1. THE PATH. These tasks wrote to
    #      /home/{{ ansible_env.USER | default(ansible_user_id) }}/.bashrc
    #    but ansible_env follows the BECOME identity, not the invoker. This
    #    play has become: yes at play level, so ansible_env.USER renders
    #    "root" and every rebuild died here with
    #      "Destination /home/root/.bashrc does not exist !"
    #    ansible_env.SUDO_USER is <UNDEFINED> under become, so that is not a
    #    fix either. The target account is now NAMED, in dcnc_user above.
    #
    # 2. THE FILE. .bashrc is sourced only by INTERACTIVE bash shells. The
    #    consumer of these variables is
    #      ~/linuxcnc/configs/DCNC/hal_components/bin/aircompressor
    #    a Python HAL component reading os.environ, launched by LinuxCNC from
    #    the GUI session (lightdm -> user@<uid>.service) and never from an
    #    interactive shell -- so it never saw a .bashrc export. It also fails
    #    SOFT: it prints "Adafruit.io credentials not set in environment
    #    variables, unable to connect" and carries on. On the real cncpc the
    #    credentials sit in BOTH ~/.bashrc and ~/.profile, and it is the
    #    .profile copy doing the work. Fixing only the path would have built a
    #    machine that provisions cleanly, reports success, and whose air
    #    compressor control silently never connects. Write .profile.
    #
    # 3. THE EXISTENCE TEST. It was `echo "${ADAFRUIT_IO_USERNAME:-}"` through
    #    the shell module -- a non-interactive, non-login shell that sources
    #    neither .profile nor .bashrc, so it reported "unset" even on a
    #    correctly configured machine and the block could never skip. The test
    #    now reads the file that is actually written. It trims, so an empty
    #    export ADAFRUIT_IO_USERNAME="" counts as ABSENT and a machine
    #    carrying one re-prompts instead of skipping forever (cf. the restic
    #    password file below, which was 1 byte and not 0).
    # ==========================================================================
    - name: check that the dcnc user home directory exists
      ansible.builtin.stat:
        path: "/home/{{ dcnc_user }}"
      register: dcnc_home

    # Deliberately FAIL rather than create the account. This playbook
    # configures an existing LinuxCNC workstation; the operator account has to
    # be the one whose graphical session LinuxCNC is launched from, and its
    # uid, groups and skeleton are not knowable from here. Creating a
    # plausible-looking account would write credentials into a home directory
    # no HAL component ever reads -- the same class of silent success this
    # whole block exists to stop.
    - name: fail when the dcnc user home directory is missing
      ansible.builtin.fail:
        msg: >-
          /home/{{ dcnc_user }} does not exist, so there is nowhere to put the
          Adafruit IO credentials that the aircompressor HAL component reads
          from its session environment. This playbook does not create the
          operator account: it must match the account whose desktop session
          LinuxCNC runs in. Create it first, or name the right one with
          -e dcnc_user=<name>.
      when: not dcnc_home.stat.exists

    - name: check for an existing dcnc user profile
      ansible.builtin.stat:
        path: "/home/{{ dcnc_user }}/.profile"
      register: dcnc_profile_file

    - name: read the existing dcnc user profile
      ansible.builtin.slurp:
        src: "/home/{{ dcnc_user }}/.profile"
      register: dcnc_profile_content
      when: dcnc_profile_file.stat.exists
      no_log: true

    - name: decide whether usable Adafruit IO credentials are already in place
      ansible.builtin.set_fact:
        adafruit_username_usable: >-
          {{ (dcnc_profile_content.content | default('') | b64decode).splitlines()
             | map('trim')
             | select('match', 'export ADAFRUIT_IO_USERNAME=')
             | map('regex_replace', '^export ADAFRUIT_IO_USERNAME=', '')
             | map('trim', '" ')
             | reject('eq', '')
             | list | length > 0 }}
        adafruit_key_usable: >-
          {{ (dcnc_profile_content.content | default('') | b64decode).splitlines()
             | map('trim')
             | select('match', 'export ADAFRUIT_IO_KEY=')
             | map('regex_replace', '^export ADAFRUIT_IO_KEY=', '')
             | map('trim', '" ')
             | reject('eq', '')
             | list | length > 0 }}

    - name: prompt for Adafruit IO username
      ansible.builtin.pause:
        prompt: "Enter your Adafruit IO username"
      register: adafruit_username_input
      when: not adafruit_username_usable

    # pause echoes typed input BY DEFAULT, so the key was displayed on the lathe
    # PC's screen as it was typed. There was no `echo: yes` here to notice and
    # remove -- the ABSENCE of the option was the defect, which is why it
    # survived review. Every other secret prompt in this file (both VNC
    # passwords, the restic password) already hides input; this one was missed.
    # The USERNAME prompt above deliberately still echoes: it is
    # `funkenjaeger`, it is public, and hiding it would be theatre.
    - name: prompt for Adafruit IO key
      ansible.builtin.pause:
        prompt: "Enter your Adafruit IO key (input hidden)"
        echo: no
      register: adafruit_key_input
      no_log: true
      when: not adafruit_key_usable

    # GUARD -- refuse an empty capture, before anything is written.
    # ansible.builtin.pause does NOT fail when stdin is not a tty: it warns
    # "Not waiting for response to prompt as stdin is not interactive",
    # returns ok, and leaves user_input empty. Without this, an unattended run
    # writes export ADAFRUIT_IO_USERNAME="" -- and because the HAL component
    # fails soft, the only symptom is an air compressor that never connects.
    # failed_when on the pause stops the run too, but on ansible-core 2.19 it
    # reports only "Task failed: Action failed: Unknown error." (measured), so
    # this uses the fail-with-msg idiom already used by "verify VNC passwords
    # match" above and by the restic password guard below.
    - name: verify Adafruit IO credentials were actually captured
      ansible.builtin.fail:
        msg: >-
          No Adafruit IO credentials were captured. ansible.builtin.pause
          cannot prompt when stdin is not interactive, so this playbook must be
          run from a terminal. Refusing to write an empty value to
          /home/{{ dcnc_user }}/.profile: the aircompressor HAL component fails
          soft on empty credentials, so the machine would report a clean
          install while its air compressor control silently never connects.
      when: >-
        (not adafruit_username_usable and
         (adafruit_username_input.user_input | default('') | trim | length) == 0)
        or (not adafruit_key_usable and
            (adafruit_key_input.user_input | default('') | trim | length) == 0)

    # become: no (inherited intent from the original tasks) so the write runs
    # as the invoker, avoiding the become-to-unprivileged-user temp-file
    # problem. owner: makes the result correct anyway when the invoker is root.
    # The old become_user: here referenced ansible_env.USER and was inert under
    # become: no; it is gone rather than repaired.
    - name: set ADAFRUIT_IO_USERNAME environment variable
      ansible.builtin.lineinfile:
        path: "/home/{{ dcnc_user }}/.profile"
        regexp: '^export ADAFRUIT_IO_USERNAME='
        line: 'export ADAFRUIT_IO_USERNAME="{{ adafruit_username_input.user_input }}"'
        create: yes
        owner: "{{ dcnc_user }}"
        mode: '0644'
        backup: yes
      when: not adafruit_username_usable
      become: no

    - name: set ADAFRUIT_IO_KEY environment variable
      ansible.builtin.lineinfile:
        path: "/home/{{ dcnc_user }}/.profile"
        regexp: '^export ADAFRUIT_IO_KEY='
        line: 'export ADAFRUIT_IO_KEY="{{ adafruit_key_input.user_input }}"'
        create: yes
        owner: "{{ dcnc_user }}"
        mode: '0644'
        backup: yes
      # At -v the whole module argument is printed, and `line:` carries the key
      # in clear -- and -v is precisely what gets reached for when a
      # provisioning run misbehaves. Matches the restic password write below.
      # Cost, stated plainly: this task's changed/ok detail is suppressed too.
      no_log: true
      when: not adafruit_key_usable
      become: no

    # `python3 -m venv` fails on a machine that lacks the venv package --
    # "ensurepip is not available" -- and nothing here installed it. FOUND
    # 2026-09-03 when a from-scratch dry run aborted at this task, BEFORE
    # reaching the restic section. Earlier dry runs only got past it because
    # /usr/local/venv/linuxcnc_venv/bin/activate already existed from a
    # previous pass, so the guard below skipped the create entirely. A clean
    # cncpc rebuild -- the thing this playbook exists for -- would have hit it
    # for real, which is exactly the class of gap the dry run is meant to catch.
    - name: install the python venv package
      ansible.builtin.apt:
        name: python3-venv
        state: present
        update_cache: yes

    - name: create python virtual environment
      ansible.builtin.command:
        cmd: python3 -m venv /usr/local/venv/linuxcnc_venv
      when: not venv_exists.stat.exists

    - name: install adafruit-io requirements
      ansible.builtin.pip:
        requirements: ~/linuxcnc/configs/DCNC/requirements.txt
        virtualenv: /usr/local/venv/linuxcnc_venv
      become: no
      become_user: "{{ ansible_env.USER | default(ansible_user_id) }}"

    # ==========================================================================
    # RESTIC -- disaster-recovery data backup for /home/evand and /etc, added
    # 2026-08-22 (TickTick 6a81c1ba). PACKAGES artifacts that already exist and
    # are proven elsewhere; this does not redesign anything already settled.
    #
    #   - homelab-wiki docs/hosts/cncpc.md, "Backup design" + "restic"
    #     sections: restic backup /home/evand /etc --exclude-caches; restic
    #     forget --keep-daily 7 --keep-weekly 4 --keep-monthly 6 --prune; root
    #     cron 01:00 backup + Sunday 04:00 prune; RESTIC_PASSWORD_FILE=
    #     /root/.restic-password mode 0600; repo /mnt/backups/cncpc-restic, an
    #     NFS mount of 192.168.1.143:/volume1/backups, a SIBLING of the rsync
    #     target /mnt/backups/cncpc -- never a child, or rsync_backup.sh's
    #     --delete removes the repo nightly. Restore proven 2026-08-01,
    #     snapshot 31cfa91e, 99 files / 13 MB byte-for-byte.
    #   - homelab-ops.git main:cncpc/restic-verify-configs (commit 7203a652,
    #     2026-08-16) -- already versioned there and already deployed to
    #     /usr/local/bin on cncpc, root:root 0755. files/restic-verify-configs
    #     in this repo is a VERBATIM copy of that file; see its own
    #     threat-model header for why it is a wrapper and not a bare
    #     `NOPASSWD: /usr/bin/restic` grant.
    #   - files/sudoers.d/90-restic-verify-configs is copied from
    #     homelab-ops.git's OWN STAGED, UNAPPLIED patch
    #     (scratch/2026-08-21/homelab-ops-cncpc-report-backup-status.patch) --
    #     both the filename and the NOPASSWD-ness are UNCONFIRMED against the
    #     live host. See that file's header before trusting this on a real
    #     rebuild.
    #
    # NOT covered here, deliberately:
    #   - cncpc/report-backup-status.sh and the cncpc-status.json it feeds --
    #     TickTick 6a8706a5's job, still a placeholder as of 2026-08-22.
    #   - (The Timeshift/BackInTime DROP + SPLIT that this note deferred was
    #     DONE on 2026-08-30; see the comment where those tasks used to be.)
    #   - A weekly restic integrity check (--read-data-subset, as dserver's
    #     restic-backup.sh runs) -- not documented anywhere for cncpc, so not
    #     invented here; see files/cncpc-restic-backup.sh's own header.
    #
    # NOT SYNTAX-CHECKED: no `ansible` binary is available in the sandbox that
    # staged this (`which ansible ansible-playbook` -> not found). This is
    # staged, reviewed-by-reading YAML, not proven-by-running YAML.

    - name: install restic and the NFS client
      ansible.builtin.apt:
        name:
          - restic
          - nfs-common
        state: present
        update_cache: yes

    - name: mount cncpc-restic NFS share
      ansible.posix.mount:
        path: "{{ cncpc_backups_mount }}"
        src: "{{ cncpc_backups_nfs_src }}"
        fstype: nfs4
        opts: defaults
        state: mounted
      when: cncpc_backups_mount_nfs | bool
      # VERIFY OPTS AGAINST THE LIVE /etc/fstab BEFORE A REAL REBUILD.
      # "defaults" is not a transcription of the live mount line -- no SSH is
      # reachable from the sandbox that staged this, and homelab-wiki only
      # records THAT the export permits 192.168.1.0/24, not what mount
      # options are in use. This is exactly the class of thing the task's own
      # CI dry-run exists to catch; do not trust it untested.
      # ansible.posix is a separate collection from ansible.builtin -- confirm
      # it (or an equivalent) is available on the control node, since nothing
      # in this repo's README currently documents a collections requirement.

    # A scratch target is a plain directory, not a mount, so nothing else
    # creates it. Only runs when the NFS mount is disabled, i.e. a dry run.
    - name: ensure the backup directory exists (dry-run / non-NFS target)
      ansible.builtin.file:
        path: "{{ cncpc_backups_mount }}"
        state: directory
        owner: root
        group: root
        mode: '0700'
      when: not (cncpc_backups_mount_nfs | bool)

    - name: check for existing restic password file
      ansible.builtin.stat:
        path: /root/.restic-password
      register: restic_pass_file

    # GUARD B -- un-stick a machine that already carries a bad password file.
    # A password file that EXISTS but is empty is worse than no file at all:
    # restic refuses it ("an empty password is not allowed by default") while
    # a bare stat.exists test sees it, skips the prompt below, and leaves the
    # machine permanently unable to authenticate to its own repo -- every
    # later run reports ok/skipped and changes nothing. Measured on the
    # dry-run VM: a non-interactive run writes a file of size 1, holding just
    # the newline the write task appends, so a stat.size > 0 test does NOT
    # catch it. The content has to be read and trimmed.
    - name: read the existing restic password file
      ansible.builtin.slurp:
        src: /root/.restic-password
      register: restic_pass_file_content
      when: restic_pass_file.stat.exists
      no_log: true

    - name: decide whether a usable restic password file is already in place
      ansible.builtin.set_fact:
        restic_pass_file_usable: >-
          {{ restic_pass_file.stat.exists
             and (restic_pass_file_content.content | default('')
                  | b64decode | trim | length) > 0 }}

    - name: prompt for restic repository password if needed
      ansible.builtin.pause:
        prompt: >-
          Enter the EXISTING restic repository password for
          /mnt/backups/cncpc-restic. The repo already holds snapshots from the
          machine being rebuilt -- this MUST be the same password used to
          create it, not a freshly chosen one, or every restic command below
          will fail with "wrong password". Retrieve it from wherever it is
          held out of band; it is not, and must not be, recorded in this repo.
        echo: no
      register: restic_password_input
      no_log: true
      when: not restic_pass_file_usable

    # GUARD A -- refuse the bad write. ansible.builtin.pause does NOT fail when
    # stdin is not a tty: it warns "Not waiting for response to prompt as stdin
    # is not interactive", returns ok, and leaves user_input empty, so without
    # this check the write task below lands that empty value. failed_when on
    # the pause stops the run too, but on ansible-core 2.19 it reports only
    # "Task failed: Action failed: Unknown error.", which tells the operator
    # nothing -- so this mirrors "verify VNC passwords match" above instead.
    - name: verify a restic repository password was actually captured
      ansible.builtin.fail:
        msg: >-
          No restic repository password was captured. ansible.builtin.pause
          cannot prompt when stdin is not interactive, so this playbook must be
          run from a terminal. Refusing to write an empty
          /root/.restic-password -- restic rejects an empty password, and the
          file would then make every later run skip this block, leaving the
          machine looking configured while its backups can never authenticate.
      when:
        - not restic_pass_file_usable
        - (restic_password_input.user_input | default('') | trim | length) == 0

    - name: write restic password file
      ansible.builtin.copy:
        content: "{{ restic_password_input.user_input }}\n"
        dest: /root/.restic-password
        owner: root
        group: root
        mode: '0600'
      when: not restic_pass_file_usable
      no_log: true

    - name: install restic-verify-configs wrapper
      ansible.builtin.copy:
        src: files/restic-verify-configs
        dest: /usr/local/bin/restic-verify-configs
        owner: root
        group: root
        mode: '0755'

    - name: install sudoers grant for restic-verify-configs
      ansible.builtin.copy:
        src: files/sudoers.d/90-restic-verify-configs
        dest: /etc/sudoers.d/90-restic-verify-configs
        owner: root
        group: root
        mode: '0440'
        validate: 'visudo -cf %s'
      # Filename UNCONFIRMED against the live host -- see the file's own
      # header. Confirm with `sudo ls /etc/sudoers.d/` on cncpc first.

    - name: install cncpc restic backup/prune script
      ansible.builtin.template:
        src: templates/cncpc-restic-backup.sh.j2
        dest: /usr/local/bin/cncpc-restic-backup.sh
        owner: root
        group: root
        mode: '0755'

    - name: schedule nightly restic backup (root cron, 01:00)
      ansible.builtin.cron:
        name: "restic backup: /home/evand + /etc -> cncpc-restic"
        user: root
        minute: "0"
        hour: "1"
        job: "/usr/local/bin/cncpc-restic-backup.sh backup"

    - name: schedule weekly restic prune (root cron, Sunday 04:00)
      ansible.builtin.cron:
        name: "restic prune: cncpc-restic"
        user: root
        minute: "0"
        hour: "4"
        weekday: "0"
        job: "/usr/local/bin/cncpc-restic-backup.sh prune"

  handlers:

    - name: reload networkmanager
      ansible.builtin.systemd:
        name: NetworkManager
        state: reloaded
    - name: restart lightdm
      ansible.builtin.systemd:
        name: lightdm
        state: restarted

    - name: reload systemd
      ansible.builtin.systemd:
        daemon_reload: yes

    - name: restart x11vnc
      ansible.builtin.systemd:
        name: x11vnc
        state: restarted

    # become: no because this is a USER unit -- `systemctl --user` as root
    # addresses root's manager, which is not the one running the guard.
    # failed_when: false because a provisioning run with no graphical session
    # has nothing to restart, and that is not an error; the --global enable
    # has already arranged for the next login to pick the new file up.
    - name: restart display guard
      ansible.builtin.command:
        cmd: systemctl --user restart cncpc-display-guard.service
      become: no
      register: display_guard_restart
      changed_when: display_guard_restart.rc == 0
      failed_when: false

    - name: reload udev rules
      ansible.builtin.shell:
        cmd: udevadm control --reload-rules && udevadm trigger
